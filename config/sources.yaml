# Source instances. Adding a source is a config change (or POST
# /v1/admin/sources). On startup, sources not yet in the database are added;
# existing ones are left as they are unless `news config reload --overwrite`.
# Secrets are written as ${ENV_NAME} and resolved when the source runs; they
# are never stored in the database.
#
# Fields: name, type, enabled, trust_weight (0-1), default_topics,
# poll_interval (seconds), rate_limit_per_min, monthly_budget_usd (paid
# sources), config (validated against the connector type's schema; see
# GET /v1/admin/sources/types).

# Mainstream outlets plus independent and alternative sources across the
# political spectrum (added and tested 2026-11-16). Trust weights are a
# starting point for tuning, not a judgement of viewpoint.

sources:
- name: bbc-science-environment
  type: rss
  enabled: true
  trust_weight: 0.8
  poll_interval: 600
  config:
    url: https://feeds.bbci.co.uk/news/science_and_environment/rss.xml
